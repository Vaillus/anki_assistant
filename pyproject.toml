[project]
name = "anki-assistant"
version = "0.2.0"
description = "Review flagged Anki cards efficiently: AnkiConnect client, deck sources, local web UI with Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
anki = "anki_assistant.cli:main"
anki-web = "anki_assistant.web.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_assistant"]

[dependency-groups]
dev = ["ruff>=0.6", "ty", "pytest>=8", "httpx>=0.27"]
proto = []

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
exclude = ["prototype"]

# scripts/ holds standalone dev tooling, imported by its tests via sys.path.
[tool.ty.environment]
extra-paths = ["scripts"]
