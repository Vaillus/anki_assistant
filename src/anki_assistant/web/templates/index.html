<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  /* Stamp the resolved theme before the stylesheet paints, so a reload never flashes
     another one. Stored choice wins over the OS; static/state.js uses the same key.
     The two defaults repeat DEFAULTS in scripts/fetch_omarchy_themes.py — they have to
     be inline to beat the stylesheet. An unknown slug is left to themes.css's bare
     :root and corrected by state.js on load. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("anki-theme"); } catch (e) { /* private mode */ }
    if (!t) {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "tokyo-night"
        : "catppuccin-latte";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<title>Anki — revue des cartes flaguées</title>
<link rel="icon" href="/static/star.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/themes.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app"><div class="empty">Chargement…</div></div>
<script src="/static/themes.js"></script>
<script src="/static/state.js"></script>
<script src="/static/api.js"></script>
<script src="/static/render.js"></script>
<script src="/static/workspace.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
